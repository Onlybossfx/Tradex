<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — TraydR</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFB34E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --amber:#C2690A; --amber-light:#D97706; --bg:#FFF8F0; --bg2:#FFECD2; --border:rgba(255,160,60,0.35); --text:#1C1208; --muted:rgba(28,18,8,0.55); --serif:'Playfair Display',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif; }
    [data-theme="dark"] { --amber:#F59E0B; --bg:#0a0a0a; --bg2:#0f0f0f; --border:rgba(255,255,255,0.07); --text:#fff; --muted:rgba(255,255,255,0.45); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:var(--sans); background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
    nav { background:#FFB34E; padding:0 1.25rem; height:62px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
    [data-theme="dark"] nav { background:rgba(10,10,10,0.97) !important; border-bottom:1px solid rgba(255,255,255,0.07); }
    .nav-logo img { height:44px; width:auto; }
    .nav-back { background:transparent; border:1px solid rgba(28,18,8,0.3); color:#1C1208; padding:0.4rem 1rem; border-radius:6px; font-size:0.85rem; font-weight:600; cursor:pointer; text-decoration:none; }
    [data-theme="dark"] .nav-back { border-color:rgba(255,255,255,0.2); color:#fff; }
    .container { max-width:720px; margin:0 auto; padding:3rem 1.5rem; }
    h1 { font-family:var(--serif); font-size:clamp(1.8rem,5vw,2.5rem); font-weight:700; margin-bottom:1rem; letter-spacing:-0.03em; }
    h2 { font-family:var(--serif); font-size:1.25rem; font-weight:700; margin:2rem 0 0.75rem; color:var(--amber); }
    p { color:var(--muted); line-height:1.8; margin-bottom:1rem; font-size:0.93rem; }
    strong { color:var(--text); }
    .section { margin-bottom:2rem; padding-bottom:2rem; border-bottom:1px solid var(--border); }
    .section:last-child { border-bottom:none; }
    .blog-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1.25rem; margin-top:1.5rem; }
    .blog-card { background:var(--bg2); border:1px solid var(--border); border-radius:14px; overflow:hidden; cursor:pointer; transition:border-color 0.2s; text-decoration:none; color:var(--text); display:block; }
    .blog-card:hover { border-color:var(--amber); }
    .blog-thumb { height:140px; background:var(--amber); display:flex; align-items:center; justify-content:center; font-size:2.5rem; color:rgba(255,255,255,0.3); }
    .blog-body { padding:1rem; }
    .blog-tag { font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--amber); margin-bottom:0.4rem; }
    .blog-title { font-family:var(--serif); font-size:1rem; font-weight:700; margin-bottom:0.4rem; line-height:1.4; }
    .blog-meta { font-size:0.75rem; color:var(--muted); }
    .coming-soon { text-align:center; padding:4rem 2rem; }
    .coming-soon i { font-size:3rem; color:var(--amber); margin-bottom:1rem; display:block; }
    @media(max-width:480px) { .blog-grid { grid-template-columns:1fr; } }
  </style>
  <script src="currency.js"></script>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo"><img src="logo.png" alt="TraydR" style="height:44px;width:auto;display:block;object-fit:contain"></a>
    <a href="index.html" class="nav-back"><i class="fas fa-arrow-left"></i> Back</a>
  </nav>
  <div class="container">
    <h1>TraydR Blog</h1>
    <p>Tips, stories and updates from the TraydR team.</p>

    <div class="coming-soon">
      <i class="fas fa-pen-to-square"></i>
      <h2 style="margin-top:0;color:var(--text)">Coming Soon</h2>
      <p>We're working on articles about selling online, growing your business in Africa, and making the most of TraydR. Check back soon!</p>
      <a href="mailto:hello@traydr.market" style="color:var(--amber);font-size:0.88rem">Want to write for us? Get in touch →</a>
    </div>
  </div>
  <script>(function(){const t=localStorage.getItem('traydr_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>
</body>
</html>
