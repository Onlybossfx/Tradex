<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | TraydR</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFB34E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --amber: #C2690A; --amber-light: #D97706;
      --bg: #FFF8F0; --bg2: #FFECD2;
      --border: rgba(255,160,60,0.35);
      --text: #1C1208; --muted: rgba(28,18,8,0.55);
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
    }
    [data-theme="dark"] {
      --amber: #F59E0B; --amber-light: #FBBF24;
      --bg: #0a0a0a; --bg2: #0f0f0f;
      --border: rgba(255,255,255,0.07);
      --text: #fff; --muted: rgba(255,255,255,0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .logo { margin-bottom: 2.5rem; }
    .logo img { height: 64px; width: auto; }
    .code {
      font-family: var(--serif);
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 700;
      line-height: 1;
      color: var(--amber);
      margin-bottom: 0.5rem;
      letter-spacing: -0.04em;
    }
    .title {
      font-family: var(--serif);
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    .desc {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.7;
      max-width: 400px;
      margin: 0 auto 2rem;
    }
    .btns {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-home {
      background: var(--amber);
      border: none;
      color: #fff;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-home:hover { background: var(--amber-light); }
    .btn-back {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-back:hover { border-color: var(--amber); color: var(--amber); }
    .suggestions {
      margin-top: 3rem;
      padding: 1.5rem;
      background: rgba(255,236,210,0.6);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 420px;
      width: 100%;
    }
    [data-theme="dark"] .suggestions {
      background: rgba(255,255,255,0.04);
    }
    .suggestions h3 {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.85rem;
    }
    .suggestion-links {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .suggestion-links a {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0.85rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .suggestion-links a:hover {
      border-color: var(--amber);
      color: var(--amber);
    }
    .suggestion-links a i {
      color: var(--amber);
      width: 16px;
      text-align: center;
    }
    .icon-wrap {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      opacity: 0.15;
    }
  </style>
</head>
<body>
  <div class="logo">
    <a href="index.html"><img src="logo.png" alt="TraydR"></a>
  </div>

  <div class="icon-wrap"><i class="fas fa-magnifying-glass"></i></div>

  <div class="code">404</div>
  <h1 class="title">Page not found</h1>
  <p class="desc">The page you're looking for doesn't exist or may have been moved. Let's get you back on track.</p>

  <div class="btns">
    <a href="index.html" class="btn-home"><i class="fas fa-house"></i> Go Home</a>
    <a href="#" onclick="history.back()" class="btn-back"><i class="fas fa-arrow-left"></i> Go Back</a>
  </div>

  <div class="suggestions">
    <h3>You might be looking for</h3>
    <div class="suggestion-links">
      <a href="browse.html"><i class="fas fa-grid-2"></i> Browse Marketplace</a>
      <a href="traydr-auth.html#signup"><i class="fas fa-user-plus"></i> Create an Account</a>
      <a href="dashboard-seller.html"><i class="fas fa-chart-bar"></i> Seller Dashboard</a>
      <a href="dashboard-buyer.html"><i class="fas fa-shopping-bag"></i> Buyer Dashboard</a>
      <a href="mailto:hello@traydr.market"><i class="fas fa-envelope"></i> Contact Support</a>
    </div>
  </div>

  <script>
    (function() {
      const t = localStorage.getItem('traydr_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</body>
</html>
